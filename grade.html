<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인천 고입 성적 산출 시스템 (2027 지침)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); min-height: 100vh; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .glass-panel { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.5); border: 1px solid #fff; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .tab-btn.active { background: #fff; color: #4a90e2; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .score-box { font-size: 28px; font-weight: bold; color: #4a90e2; }
        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.7); border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background: rgba(166, 193, 238, 0.5); }
        input[type="number"] { width: 50px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-panel">
        <h1>인천동양중 3-6 고입 성적 산출 (2027 지침)</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <label>교과.xlsx <input type="file" onchange="loadFile(event, 'sub')"></label>
            <label>출결.xlsx <input type="file" onchange="loadFile(event, 'att')"></label>
            <label>봉사.xlsx <input type="file" onchange="loadFile(event, 'vol')"></label>
            <label>수상.xlsx <input type="file" onchange="loadFile(event, 'awd')"></label>
        </div>
        <button onclick="processData()" style="width:100%; padding:15px; margin-top:15px; cursor:pointer;">🔄 데이터 분석 및 점수 산출</button>
        <select id="studentSelect" onchange="updateView()" style="width:100%; padding:10px; margin-top:10px; display:none;"></select>
    </div>

    <div class="tabs" id="tabs" style="display:none;">
        <button class="tab-btn active" onclick="setTab('t1')">교과(240점)</button>
        <button class="tab-btn" onclick="setTab('t2')">비교과(60점)</button>
        <button class="tab-btn" onclick="setTab('t3')">성적분석</button>
        <button class="tab-btn" onclick="setTab('tAdmin')" style="background:#ffdada;">관리자(수정)</button>
    </div>

    <div class="glass-panel" id="mainContent" style="display:none;">
        <div id="t1" class="tab-content active">
            <h2>교과 평균 평점 (인천식)</h2>
            <div id="gpaResult" class="score-box">-</div>
        </div>
        <div id="t2" class="tab-content">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div><h3>출결 (21점)</h3><div id="attS" class="score-box">-</div></div>
                <div><h3>행동발달 (9점)</h3><div id="hbS" class="score-box">-</div></div>
                <div><h3>자·동·진 (15점)</h3><div id="cdjS" class="score-box">-</div></div>
                <div><h3>봉사활동 (15점)</h3><div id="volS" class="score-box">-</div></div>
            </div>
        </div>
        <div id="t3" class="tab-content"><canvas id="chart"></canvas></div>
        <div id="tAdmin" class="tab-content">
            <table id="adminTable">
                <thead><tr><th>성명</th><th>출결</th><th>행발가산</th><th>창체가산</th><th>봉사가산</th><th>저장</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let raw = { sub:[], att:[], vol:[], awd:[] };
let data = {};
let chart = null;

function loadFile(e, k) {
    const r = new FileReader();
    r.onload = (ev) => {
        const b = XLSX.read(ev.target.result, {type:'binary'});
        raw[k] = XLSX.utils.sheet_to_json(b.Sheets[b.SheetNames[0]]).map(r => {
            let n = {}; for(let key in r) n[key.replace(/\s+/g,'')] = r[key]; return n;
        });
    };
    r.readAsBinaryString(e.target.files[0]);
}

function processData() {
    const names = [...new Set(raw.sub.map(r => r.성명))].filter(n => n && n !== '성명');
    names.forEach(name => {
        // 1. 교과 산출
        const mySub = raw.sub.filter(r => r.성명 === name);
        let s12=0, c12=0, s3=0, c3=0, trend=[];
        mySub.forEach(r => {
            const m = String(r['성취도(수강자수)']||'').match(/[A-E]/);
            if(!m) return;
            const sc = {A:5,B:4,C:3,D:2,E:1}[m[0]];
            if(r.학년 < 3) { s12+=sc; c12++; } else { s3+=sc; c3++; }
        });

        // 2. 출결 산출 (인천 21점 기준)
        const myAtt = raw.att.filter(r => r.성명 === name);
        let abs=0, etc=0;
        myAtt.forEach(r => {
            const v = Object.values(r);
            abs += Number(r.미인정 || v[5] || 0);
            etc += Number(v[8]||0) + Number(v[11]||0) + Number(v[14]||0);
        });
        const totalAbs = abs + Math.floor(etc/3);
        const attScore = totalAbs >= 21 ? 10 : Math.max(10, 21 - Math.floor(totalAbs/2));

        // 3. 봉사 시간 점수 (1학년 만점, 2/3학년 기준)
        const myVol = raw.vol.filter(r => r.성명 === name);
        let vSc = 4; // 1학년 기본 만점
        [2,3].forEach(g => {
            const hr = myVol.filter(v => v.학년 == g).reduce((a,b) => a + Number(b.시간||0), 0);
            vSc += (hr >= 20 ? 4 : hr >= 11 ? 3 : 2);
        });

        // 4. 가산점 (수상경력 기반 1차 추출)
        const myAwd = raw.awd.filter(r => r.성명 === name);
        const hasA = (t) => myAwd.some(a => a.수상명.includes(t)) ? 1 : 0;
        
        data[name] = {
            gpa12: c12 ? (s12/c12).toFixed(2) : '-', gpa3: c3 ? (s3/c3).toFixed(2) : '-',
            att: attScore,
            hb_g: 2*3, hb_a: Math.min(1, myAwd.length * 0.5), // 예시: 상장당 0.5
            cdj_g: 2*3, cdj_a: Math.min(3, myAwd.length * 1.0),
            vol_t: vSc, vol_a: hasA('봉사') ? 1 : 0
        };
    });

    const sel = document.getElementById('studentSelect');
    sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
    sel.style.display = 'block';
    document.getElementById('tabs').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    renderAdmin();
}

function updateView() {
    const n = document.getElementById('studentSelect').value;
    const d = data[n];
    document.getElementById('gpaResult').innerText = `1,2학년: ${d.gpa12} / 3학년: ${d.gpa3}`;
    document.getElementById('attS').innerText = d.att + " / 21";
    document.getElementById('hbS').innerText = (d.hb_g + d.hb_a).toFixed(1) + " / 9";
    document.getElementById('cdjS').innerText = (d.cdj_g + d.cdj_a).toFixed(1) + " / 15";
    document.getElementById('volS').innerText = (d.vol_t + d.vol_a).toFixed(1) + " / 15";
}

function renderAdmin() {
    const b = document.querySelector('#adminTable tbody'); b.innerHTML = '';
    for(let n in data) {
        const d = data[n];
        b.innerHTML += `<tr><td>${n}</td><td>${d.att}</td>
            <td><input type="number" value="${d.hb_a}" id="ha_${n}"></td>
            <td><input type="number" value="${d.cdj_a}" id="ca_${n}"></td>
            <td><input type="number" value="${d.vol_a}" id="va_${n}"></td>
            <td><button onclick="save('${n}')">💾</button></td></tr>`;
    }
}

function save(n) {
    data[n].hb_a = Number(document.getElementById(`ha_${n}`).value);
    data[n].cdj_a = Number(document.getElementById(`ca_${n}`).value);
    data[n].vol_a = Number(document.getElementById(`va_${n}`).value);
    alert('저장됨'); updateView();
}

function setTab(id) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
}
</script>
</body>
</html>
