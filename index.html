<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>INTO THE 306 WORLD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
    
    <script>
        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav .nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        };

        window.showSubTab = (btn, sectionId, tabId) => {
            const section = document.getElementById(sectionId);
            section.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            section.querySelectorAll('.sub-nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        };

        window.showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast show ' + type;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        };

        window.previewCertPhoto = (input) => {
            const file = input.files[0];
            if (!file) return;
            const preview = document.getElementById('cert-preview');
            const placeholder = document.getElementById('cert-placeholder');
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
            };
            reader.readAsDataURL(file);
        };

        window.triggerCamera = () => {
            const input = document.getElementById('cert-file-input');
            input.setAttribute('capture', 'environment');
            input.click();
        };
        
        window.triggerGallery = () => {
            const input = document.getElementById('cert-file-input');
            input.removeAttribute('capture');
            input.click();
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAc5S87JK-LtXzk5-iTR9rt7RnHWnUXTQ",
            authDomain: "ho0911seong-56638.firebaseapp.com",
            databaseURL: "https://ho0911seong-56638-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ho0911seong-56638",
            storageBucket: "ho0911seong-56638.firebasestorage.app",
            messagingSenderId: "994509567071",
            appId: "1:994509567071:web:c75eb195e1f3fa40f557ea"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        const startDate = new Date("2026-03-03");
        const endDate = new Date("2027-01-08");
        const holidays = ["2026-01-01","2026-01-28","2026-01-29","2026-01-30","2026-03-01","2026-05-05","2026-05-25","2026-06-06","2026-08-15","2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-09","2026-12-25"];

        const MAX_DAILY_CERT = 1;
        const CERT_MILEAGE = 3;

        let globalData = {};
        let studentList = [];

        onValue(ref(db, 'class306'), (snapshot) => {
            globalData = snapshot.val() || {};
            
            // 학생 명단 동기화 (관리자 모드에서 추가된 형식)
            if (globalData.students) {
                studentList = Object.values(globalData.students)
                                    .sort((a, b) => a.num - b.num)
                                    .map(s => `${s.num} ${s.name}`);
            }

            populateDropdowns();
            renderHome(globalData.calendar || {});
            renderMileage(globalData.mileage || {});
            renderPraise(globalData.praise || {});
            renderToday(globalData.impression || {});
            renderMileageGuide(globalData.config || {});
            renderStudyCertHistory(globalData.studyCert || {});
            const todayStr = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
            if (document.getElementById('display-date')) document.getElementById('display-date').innerText = todayStr;
            autoSetDailyQuestion(globalData.config || {});
        });

        const questionBank = [
            "오늘 점심 메뉴에 점수를 매긴다면 몇 점인가요?","오늘 하루를 날씨로 표현하면 어떤 날씨인가요?",
            "오늘 나를 동물로 표현하면 어떤 동물인가요?","오늘 BGM으로 깔고 싶은 노래가 있나요?",
            "오늘 나의 에너지 잔량은 몇 퍼센트인가요?","오늘 가장 웃겼던 일은 무엇인가요?",
            "지금 당장 먹고 싶은 음식이 있나요?","오늘 누군가를 도왔거나 도움을 받은 적이 있나요?",
            "지금 이 순간 306반에 하고 싶은 말이 있나요?"
        ];

        function autoSetDailyQuestion(config) {
            const today = new Date();
            const dow = today.getDay();
            const dateStr = today.toISOString().slice(0, 10);
            const isHoliday = holidays.includes(dateStr);
            const isWeekend = dow === 0 || dow === 6;
            const qEl = document.getElementById('daily-q-text');
            if (isWeekend || isHoliday) {
                if (qEl) qEl.innerText = "🌸 오늘은 쉬어가는 날이에요!";
                document.getElementById('t-submit-area').style.display = 'none';
                return;
            }
            document.getElementById('t-submit-area').style.display = 'block';
            if (config.manualQuestion && config.manualQuestionDate === dateStr) {
                if (qEl) qEl.innerText = config.manualQuestion;
            } else {
                const dayIndex = Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) % questionBank.length;
                const q = questionBank[Math.max(0, dayIndex) % questionBank.length];
                if (qEl) qEl.innerText = q;
            }
        }

        function getTodayCertCount(name) {
            const todayStr = new Date().toISOString().slice(0, 10);
            const certs = globalData.studyCert || {};
            return Object.values(certs).filter(c => c.name === name && c.date === todayStr && c.result === 'pass').length;
        }

        window.submitStudyCert = async () => {
            const name = document.getElementById('cert-name').value;
            const file = document.getElementById('cert-file-input').files[0];
            const studyContent = document.getElementById('cert-study-content').value.trim();
            const btn = document.getElementById('cert-submit-btn');

            if (!name) return window.showToast("이름을 선택해주세요.", 'error');
            if (!file) return window.showToast("사진을 선택해주세요.", 'error');
            if (!studyContent) return window.showToast("무엇을 공부했는지 입력해주세요.", 'error');

            const todayCount = getTodayCertCount(name);
            if (todayCount >= MAX_DAILY_CERT) return window.showToast(`오늘은 이미 체크했어요! 내일 또 해요 😊`, 'error');

            const CLAUDE_API_KEY = globalData.config?.claudeApiKey || "";
            if(!CLAUDE_API_KEY) return window.showToast("API 키가 설정되지 않았습니다.", 'error');

            btn.disabled = true;
            btn.innerText = "AI 분석 중... 🤖";
            document.getElementById('cert-result-box').style.display = 'none';

            try {
                const base64 = await fileToBase64(file);
                const mediaType = file.type || 'image/jpeg';
                const todayISO = new Date().toISOString().slice(0, 10);

                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-api-key": CLAUDE_API_KEY,
                        "anthropic-version": "2023-06-01",
                        "anthropic-dangerous-direct-browser-access": "true"
                    },
                    body: JSON.stringify({
                        model: "claude-opus-4-5",
                        max_tokens: 400,
                        messages: [{
                            role: "user",
                            content: [
                                { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
                                {
                                    type: "text",
                                    text: `오늘 날짜는 ${todayISO} 입니다.
이 사진을 보고 아래 두 가지를 판단하세요.
[1] 타임스탬프 날짜 확인 - 사진에 날짜/시간 타임스탬프가 있으면 읽어서 오늘(${todayISO})과 비교, 연/월/일이 모두 일치하면 date_match: true (없거나 다르면 false, photo_date 기록)
[2] 공부 사진 여부 - 교과서, 문제집, 필기 등이 보이면 is_study: true
통과 조건: date_match AND is_study 둘 다 true일 때만 pass: true
반드시 JSON만 반환:
{"pass":true/false,"date_match":true/false,"is_study":true/false,"photo_date":"읽은날짜","reason":"이유 25자이내","emoji":"이모지1개"}`
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                const rawText = data.content?.[0]?.text || '{"pass":false,"date_match":false,"is_study":false,"photo_date":"없음","reason":"분석 실패","emoji":"❌"}';
                
                let result;
                try { result = JSON.parse(rawText.replace(/```json|
```/g, '').trim()); } 
                catch { result = { pass: false, date_match: false, is_study: false, photo_date: "없음", reason: "분석 오류", emoji: "⚠️" }; }

                if (!result.pass) {
                    if (!result.date_match && result.is_study) { result.reason = `날짜 불일치 (사진: ${result.photo_date || '없음'})`; result.emoji = "📅"; } 
                    else if (result.date_match && !result.is_study) { result.reason = "공부 중인 사진이 아니에요"; result.emoji = "📚"; } 
                    else if (!result.date_match && !result.is_study) { result.reason = "날짜 불일치 + 공부 사진 아님"; result.emoji = "❌"; }
                }

                let photoURL = '';
                try {
                    const ext = file.name.split('.').pop() || 'jpg';
                    const storageRef = sRef(storage, `studyCert/${name}_${Date.now()}.${ext}`);
                    await uploadBytes(storageRef, file);
                    photoURL = await getDownloadURL(storageRef);
                } catch(e) { console.warn("Storage 업로드 실패:", e); }

                const certData = {
                    name, date: todayISO, time: new Date().toLocaleString('ko-KR'), studyContent,
                    result: result.pass ? 'pass' : 'fail', reason: result.reason,
                    photoDate: result.photo_date || '없음', emoji: result.emoji, photoURL,
                    mileage: result.pass ? CERT_MILEAGE : 0
                };
                await push(ref(db, 'class306/studyCert'), certData);

                if (result.pass) {
                    const [mSnap, eSnap] = await Promise.all([
                        get(ref(db, `class306/mileage/${name}`)), get(ref(db, `class306/totalEarned/${name}`))
                    ]);
                    const before = mSnap.val() || 0;
                    const beforeEarned = eSnap.val() || before;
                    const afterEarned = beforeEarned + CERT_MILEAGE;
                    await set(ref(db, `class306/mileage/${name}`), before + CERT_MILEAGE);
                    await set(ref(db, `class306/totalEarned/${name}`), afterEarned);
                    if (getLevel(beforeEarned).level < getLevel(afterEarned).level) {
                        setTimeout(() => window.showToast(`🎉 ${name} 레벨업! Lv.${getLevel(afterEarned).level}`, 'levelup'), 1200);
                    }
                }
                showCertResult(result, name, studyContent);
            } catch(err) {
                console.error(err);
                window.showToast("오류가 발생했어요. 잠시 후 다시 시도해주세요.", 'error');
            } finally {
                btn.disabled = false; btn.innerText = "스터디 체크하기 📚";
                document.getElementById('cert-file-input').value = '';
                document.getElementById('cert-study-content').value = '';
                document.getElementById('cert-preview').style.display = 'none';
                document.getElementById('cert-placeholder').style.display = 'flex';
            }
        };

        function showCertResult(result, name, studyContent) {
            const box = document.getElementById('cert-result-box');
            box.style.display = 'block';
            box.className = 'cert-result-box ' + (result.pass ? 'pass' : 'fail');
            document.getElementById('cert-result-emoji').innerText = result.emoji || (result.pass ? '🎉' : '😢');
            document.getElementById('cert-result-title').innerText = result.pass ? '체크 완료!' : '체크 실패';
            document.getElementById('cert-result-desc').innerText = result.pass ? `"${studyContent}" 공부 확인! ✅` : result.reason;
            document.getElementById('cert-result-mileage').innerText = result.pass ? `${name} +${CERT_MILEAGE}P 적립! 오늘 체크 완료 ✅` : (result.date_match === false ? `📅 사진 날짜(${result.photo_date || '없음'})와 오늘 날짜가 달라요` : '오늘 날짜 타임스탬프가 찍힌 공부 사진을 올려주세요!');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        window.renderStudyCertHistory = (certObj) => {
            const container = document.getElementById('cert-history-list');
            if (!container) return;
            container.innerHTML = '';
            const certs = Object.entries(certObj).sort((a, b) => new Date(b[1].time) - new Date(a[1].time)).slice(0, 30);
            if (certs.length === 0) return container.innerHTML = "<p class='empty-msg'>아직 체크 기록이 없어요 📚</p>";
            const grouped = {};
            certs.forEach(([, c]) => { if (!grouped[c.date]) grouped[c.date] = []; grouped[c.date].push(c); });
            Object.entries(grouped).sort((a,b) => b[0].localeCompare(a[0])).forEach(([date, items]) => {
                container.innerHTML += `<div class="group-label">📅 ${date}</div>`;
                items.forEach(c => {
                    container.innerHTML += `
                        <div class="cert-history-item ${c.result}">
                            <span class="cert-hist-emoji">${c.emoji || (c.result === 'pass' ? '✅' : '❌')}</span>
                            <div class="cert-hist-info">
                                <b>${c.name}</b>
                                ${c.studyContent ? `<span class="cert-hist-subject">"${c.studyContent}"</span>` : ''}
                                <span>${c.reason}</span>
                            </div>
                            <span class="cert-hist-score">${c.result === 'pass' ? '+' + c.mileage + 'P' : '반려'}</span>
                        </div>`;
                });
            });
        };

        function renderHome(calObj) {
            const today = new Date();
            const diffStart = Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) + 1;
            const diffEnd = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));
            document.getElementById('d-day-start').innerText = diffStart > 0 ? diffStart : 0;
            document.getElementById('d-day-end').innerText = diffEnd > 0 ? diffEnd : 0;
            const container = document.getElementById('cal-list');
            if (!container) return;
            container.innerHTML = '';
            const threeWeeks = new Date(); threeWeeks.setDate(today.getDate() + 21);
            const sorted = Object.entries(calObj).filter(([, c]) => { const d = new Date(c.date); return d >= today && d <= threeWeeks; }).sort((a, b) => new Date(a[1].date) - new Date(b[1].date));
            if (sorted.length === 0) container.innerHTML = "<p class='empty-msg'>3주 내 일정이 없습니다.</p>";
            else sorted.forEach(([, c]) => { container.innerHTML += `<div class="compact-cal-item"><b>${c.date.slice(5)}</b><span>${c.title}</span></div>`; });
        }

        function getLevel(score) {
            let level = 1, required = 10, accumulated = 0;
            while (score >= accumulated + required) { accumulated += required; level++; required += 10; }
            return { level, progress: score - accumulated, nextRequired: required, accumulated };
        }

        function getLevelColor(level) {
            if (level >= 10) return '#F472B6'; if (level >= 7) return '#38BDF8';
            if (level >= 5) return '#6366F1'; if (level >= 3) return '#2DD4BF'; return '#94A3B8';
        }

        function renderMileage(mileageObj) {
            const container = document.getElementById('mileage-rank-list');
            const totalDisplay = document.getElementById('total-sum');
            const totalBar = document.getElementById('total-bar-fill');
            if (!container) return;
            container.innerHTML = '';
            let classTotal = 0;
            const allScores = {};
            const allEarned = globalData.totalEarned || {};
            studentList.forEach(name => { allScores[name] = mileageObj[name] || 0; });
            const sorted = Object.entries(allScores).sort((a, b) => b[1] - a[1]);
            sorted.forEach(([name, score], idx) => {
                if (score > 0) classTotal += score;
                const rank = idx + 1;
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}`;
                const earned = allEarned[name] || score;
                const { level, progress, nextRequired } = getLevel(earned);
                const lvColor = getLevelColor(level);
                const pct = Math.min((progress / nextRequired) * 100, 100);
                container.innerHTML += `
                    <div class="rank-card ${rank <= 3 ? 'top-rank' : ''}">
                        <div class="rank-medal">${medal}</div>
                        <div class="rank-name">${name}</div>
                        <div class="rank-lv-badge" style="color:${lvColor};border-color:${lvColor};">Lv.${level}</div>
                        <div class="rank-score">${score} <span>P</span></div>
                        <div class="rank-lv-bar-wrap"><div class="rank-lv-bar-fill" style="width:${pct}%;background:${lvColor};"></div></div>
                        <div class="rank-lv-next">${progress}/${nextRequired}P</div>
                    </div>`;
            });
            if (totalDisplay) totalDisplay.innerText = classTotal.toLocaleString();
            if (totalBar) totalBar.style.width = Math.min((classTotal / 3000) * 100, 100) + "%";
        }

        function renderMileageGuide(config) {
            const f = t => t.split('\n').map(l => `<div class="guide-line">${l}</div>`).join('');
            if (document.getElementById('display-reasons')) document.getElementById('display-reasons').innerHTML = f(config.reasons || "칭찬제보: +1P\n오늘하루: +1P\n스터디 체크: +2P");
            if (document.getElementById('display-personal-rewards')) document.getElementById('display-personal-rewards').innerHTML = f(config.personalRewards || "5P: 까까\n100P: 자리지정");
            if (document.getElementById('display-group-rewards')) document.getElementById('display-group-rewards').innerHTML = f(config.groupRewards || "3,000P: 학급 파티");
        }

        window.renderPraise = function(praiseObj, sortBy = 'date') {
            const container = document.getElementById('praise-view-list');
            if (!container) return;
            container.innerHTML = '';
            const approved = Object.entries(praiseObj).filter(([, p]) => p.approved);
            if (approved.length === 0) return container.innerHTML = "<p class='empty-msg'>아직 승인된 칭찬이 없어요 😊</p>";
            const grouped = {};
            if (sortBy === 'date') {
                approved.forEach(([, p]) => { const d = p.time ? p.time.split(' ')[0] : '날짜 미상'; if (!grouped[d]) grouped[d] = []; grouped[d].push(p); });
                Object.entries(grouped).reverse().forEach(([date, items]) => {
                    container.innerHTML += `<div class="group-label">📅 ${date}</div>`;
                    items.forEach(p => container.innerHTML += `<div class="praise-card"><div class="praise-header"><b>${p.to}</b> 친구 칭찬!</div><p>${p.content}</p><small>- ${p.from}</small></div>`);
                });
            } else {
                approved.forEach(([, p]) => { if (!grouped[p.to]) grouped[p.to] = []; grouped[p.to].push(p); });
                Object.entries(grouped).sort().forEach(([name, items]) => {
                    container.innerHTML += `<div class="group-label">👤 ${name}</div>`;
                    items.forEach(p => container.innerHTML += `<div class="praise-card"><div class="praise-header"><b>${p.to}</b> 친구 칭찬!</div><p>${p.content}</p><small>- ${p.from}</small></div>`);
                });
            }
        };

        window.renderToday = function(impObj, sortBy = 'date') {
            const container = document.getElementById('today-view-list');
            if (!container) return;
            container.innerHTML = '';
            const approved = Object.entries(impObj).filter(([, i]) => i.approved);
            if (approved.length === 0) return container.innerHTML = "<p class='empty-msg'>아직 기록이 없어요 😊</p>";
            const grouped = {};
            approved.forEach(([, i]) => { const key = i.date || '날짜 미상'; if (!grouped[key]) grouped[key] = []; grouped[key].push(i); });
            Object.entries(grouped).reverse().forEach(([date, items]) => {
                const sorted = sortBy === 'name' ? items.sort((a, b) => a.name.localeCompare(b.name)) : items;
                container.innerHTML += `<div class="group-label">📅 ${date}</div>`;
                sorted.forEach(i => container.innerHTML += `<div class="today-item"><b>${i.name}</b>: ${i.content}</div>`);
            });
        };

        function populateDropdowns() {
            ['p-from', 'p-to', 'cert-name', 't-name'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const cur = el.value;
                const placeholder = id === 'p-from' ? '제보자 선택' : id === 'p-to' ? '칭찬 주인공 선택' : '이름 선택';
                el.innerHTML = `<option value="">${placeholder}</option>`;
                studentList.forEach(name => { el.innerHTML += `<option value="${name}" ${cur === name ? 'selected' : ''}>${name}</option>`; });
            });
        }

        window.submitPraise = () => {
            const from = document.getElementById('p-from').value;
            const to = document.getElementById('p-to').value;
            const content = document.getElementById('p-content').value.trim();
            if (!from || !to || !content) return window.showToast("빈칸을 채워주세요.", 'error');
            if (from === to) return window.showToast("자기 자신은 칭찬할 수 없어요!", 'error');
            push(ref(db, 'class306/praise'), { from, to, content, approved: false, time: new Date().toLocaleString('ko-KR') });
            ['p-from','p-to','p-content'].forEach(id => document.getElementById(id).value = '');
            window.showToast("제보 완료! 선생님 승인 후 공개돼요 😊");
        };

        window.submitToday = () => {
            const name = document.getElementById('t-name').value;
            const content = document.getElementById('t-content').value.trim();
            const q = document.getElementById('daily-q-text').innerText;
            if (!name || !content) return window.showToast("내용을 입력하세요.", 'error');
            push(ref(db, 'class306/impression'), { name, content, question: q, date: new Date().toLocaleDateString('ko-KR'), approved: false, time: new Date().toLocaleString('ko-KR') });
            ['t-name','t-content'].forEach(id => document.getElementById(id).value = '');
            window.showToast("기록 완료! 선생님 승인 후 공개돼요 😊");
        };

        window.sortPraise = (btn, sortBy) => {
            document.querySelectorAll('.praise-sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPraise(globalData.praise || {}, sortBy);
        };
        window.sortToday = (btn, sortBy) => {
            document.querySelectorAll('.today-sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderToday(globalData.impression || {}, sortBy);
        };
    </script>

    <style>
        :root {
            --primary: #2DD4BF; --secondary: #38BDF8; --accent: #F472B6;
            --mint-light: #F0FDFA; --blue-light: #F0F9FF; --study: #6366F1; --study-light: #E0E7FF;
            --bg: #F0F9FF; --card: rgba(255, 255, 255, 0.85); --text: #0F172A; --text-sub: #64748B;
            --border: rgba(226, 232, 240, 0.8); --grad: linear-gradient(135deg, #2DD4BF 0%, #38BDF8 100%);
            --grad-study: linear-gradient(135deg, #6366F1 0%, #818CF8 100%);
            --shadow: 0 10px 25px -5px rgba(45, 212, 191, 0.1), 0 8px 10px -6px rgba(45, 212, 191, 0.1);
            --radius: 24px; --max-w: 680px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; letter-spacing: -0.02em; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        header { padding: 36px 0 16px; text-align: center; width: 100%; }
        h1 { font-weight: 900; font-size: clamp(2.2rem, 8vw, 3.6rem); background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.05em; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.05)); }
        nav { display: flex; gap: 8px; margin: 0 16px 20px; flex-wrap: wrap; justify-content: center; max-width: var(--max-w); width: 100%; }
        .nav-btn { padding: 12px 18px; border: 1px solid rgba(45, 212, 191, 0.2); border-radius: 16px; background: white; box-shadow: var(--shadow); cursor: pointer; font-weight: 700; color: var(--text-sub); font-size: 0.9rem; transition: all 0.2s; font-family: inherit; }
        .nav-btn.active { background: var(--text); color: white; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .class-total-banner { width: calc(100% - 32px); max-width: var(--max-w); background: var(--grad); color: white; padding: 22px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow); }
        .total-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 800; font-size: 0.95rem; }
        .progress-bar { background: rgba(255,255,255,0.3); height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { background: white; height: 100%; width: 0%; transition: width 1s ease; }
        .content-section { display: none; width: calc(100% - 32px); max-width: var(--max-w); animation: fadeIn 0.3s ease; }
        .content-section.active { display: block; }
        .glass-card { background: var(--card); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-bottom: 16px; }
        .glass-card h2 { font-size: 1.3rem; margin-bottom: 16px; letter-spacing: -0.03em; }
        .sub-nav { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; }
        .sub-nav button { background: none; border: none; font-size: 0.95rem; color: var(--text-sub); cursor: pointer; font-weight: 800; padding-bottom: 8px; border-bottom: 3px solid transparent; transition: all 0.2s; font-family: inherit; }
        .sub-nav button.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .d-day-row { display: flex; justify-content: space-around; padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .d-day-item { text-align: center; }
        .d-day-num { font-size: 2rem; font-weight: 900; color: var(--primary); }
        .d-day-label { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; font-weight: 600; }
        .compact-cal-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .compact-cal-item b { color: var(--primary); font-size: 0.9rem; min-width: 48px; }
        .rank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .rank-card { background: white; border-radius: 18px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid var(--border); }
        .rank-card.top-rank { background: linear-gradient(135deg, var(--mint-light), white); border-color: var(--primary); }
        .rank-medal { font-size: 1.4rem; font-weight: 900; color: var(--text-sub); }
        .rank-name { font-weight: 800; font-size: 0.95rem; }
        .rank-lv-badge { font-size: 0.75rem; font-weight: 900; border: 1.5px solid; border-radius: 20px; padding: 2px 10px; }
        .rank-score { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
        .rank-score span { font-size: 0.75rem; color: var(--text-sub); }
        .rank-lv-bar-wrap { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-top: 4px; }
        .rank-lv-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .rank-lv-next { font-size: 0.7rem; color: var(--text-sub); }
        .guide-section { margin-bottom: 24px; }
        .guide-section h3 { font-size: 1rem; font-weight: 800; margin-bottom: 10px; }
        .guide-box { background: var(--mint-light); border-left: 4px solid var(--primary); border-radius: 12px; padding: 16px; }
        .guide-box.pink { background: #FDF2F8; border-left-color: var(--accent); }
        .guide-box.green { background: var(--blue-light); border-left-color: var(--secondary); }
        .guide-line { padding: 4px 0; font-size: 0.95rem; font-weight: 500; }
        .cert-upload-area { border: 2px dashed var(--secondary); border-radius: 20px; text-align: center; cursor: pointer; background: #f0faff; min-height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
        #cert-placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 16px; }
        #cert-preview { display: none; width: 100%; max-height: 300px; object-fit: contain; border-radius: 18px; }
        .cert-btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .btn-cam, .btn-gallery, .btn-study-main { flex: 1; padding: 14px; border-radius: 14px; font-weight: 800; font-family: inherit; cursor: pointer; font-size: 0.95rem; border: none; }
        .btn-cam { background: var(--grad-study); color: white; }
        .btn-gallery { border: 2px solid var(--study); background: white; color: var(--study); }
        .btn-study-main { width: 100%; background: var(--study); color: white; margin-top: 6px; }
        .btn-study-main:disabled { opacity: 0.5; }
        .cert-limit-info { background: var(--study-light); border-radius: 12px; padding: 12px 16px; font-size: 0.85rem; color: var(--study); font-weight: 700; text-align: center; margin-bottom: 16px; }
        .cert-result-box { border-radius: 18px; padding: 24px; text-align: center; margin-top: 16px; }
        .cert-result-box.pass { background: var(--mint-light); border: 2px solid var(--primary); }
        .cert-result-box.fail { background: #FEF2F2; border: 2px solid #FCA5A5; }
        .cert-result-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
        .cert-result-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 6px; }
        .cert-result-desc { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 8px; }
        .cert-result-mileage { font-size: 0.9rem; font-weight: 800; color: var(--study); }
        .cert-history-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--border); background: white; }
        .cert-history-item.pass { border-left: 5px solid var(--primary); }
        .cert-history-item.fail { border-left: 5px solid #FCA5A5; opacity: 0.7; }
        .cert-hist-emoji { font-size: 1.5rem; }
        .cert-hist-info { flex: 1; }
        .cert-hist-info b { font-size: 0.95rem; display: block; }
        .cert-hist-info .cert-hist-subject { font-size: 0.9rem; color: var(--study); font-weight: 700; display: block; }
        .cert-hist-info span { font-size: 0.8rem; color: var(--text-sub); }
        .cert-hist-score { font-weight: 900; color: var(--study); font-size: 0.95rem; }
        .sort-bar { display: flex; gap: 10px; margin-bottom: 16px; }
        .sort-bar button { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: white; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: var(--text-sub); font-family: inherit; }
        .sort-bar button.active { background: var(--text); color: white; border-color: var(--text); }
        .praise-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 12px; border-left: 5px solid var(--primary); }
        .praise-header { font-weight: 800; margin-bottom: 8px; font-size: 1.05rem; }
        .praise-card p { font-size: 0.95rem; margin: 6px 0; }
        .praise-card small { color: var(--text-sub); font-size: 0.85rem; }
        .today-item { padding: 16px; background: white; border-radius: 16px; margin-bottom: 10px; font-size: 0.95rem; border: 1px solid var(--border); }
        .group-label { font-weight: 800; font-size: 0.9rem; color: var(--text-sub); padding: 12px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
        .q-box { background: var(--blue-light); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; border: 1px solid rgba(56, 189, 248, 0.2); }
        .q-box h4 { font-size: 1.05rem; font-weight: 800; }
        input[type="text"], input[type="number"], input[type="date"], textarea, select { width: 100%; padding: 14px 18px; margin-bottom: 12px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.1); font-family: inherit; font-size: 0.95rem; color: var(--text); background: #F8FAFC; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); background: white; }
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 16px; background: var(--text); color: white; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 1.05rem; }
        .empty-msg { text-align: center; color: var(--text-sub); padding: 24px 0; font-size: 0.95rem; font-weight: 500; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: white; padding: 14px 28px; border-radius: 30px; font-weight: 800; font-size: 0.95rem; z-index: 9999; transition: transform 0.3s ease; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #EF4444; }
        .toast.levelup { background: linear-gradient(135deg, var(--study), var(--primary)); font-size: 1.05rem; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 480px) { .rank-grid { grid-template-columns: repeat(3, 1fr); } nav { gap: 6px; } .nav-btn { padding: 10px 12px; font-size: 0.85rem; } }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<header><h1>INTO THE 306 WORLD</h1></header>

<nav>
    <button class="nav-btn active" onclick="window.showSection('home')" id="btn-home">🏠 홈</button>
    <button class="nav-btn" onclick="window.showSection('mileage')" id="btn-mileage">⭐ 마일리지</button>
    <button class="nav-btn" onclick="window.showSection('study')" id="btn-study">📚 스터디 체크</button>
    <button class="nav-btn" onclick="window.showSection('praise')" id="btn-praise">🌟 칭찬감옥</button>
    <button class="nav-btn" onclick="window.showSection('today')" id="btn-today">✏️ 오늘 하루</button>
</nav>

<div class="class-total-banner">
    <div class="total-info">
        <span>🏫 306 마일리지 누적 합계</span>
        <span><span id="total-sum">0</span> / 3,000 P</span>
    </div>
    <div class="progress-bar"><div id="total-bar-fill" class="progress-fill"></div></div>
</div>

<section id="home" class="content-section active">
    <div class="glass-card">
        <div class="d-day-row">
            <div class="d-day-item"><div class="d-day-num" id="d-day-start">0</div><div class="d-day-label">함께한 날</div></div>
            <div class="d-day-item"><div class="d-day-num" id="d-day-end">0</div><div class="d-day-label">졸업까지</div></div>
        </div>
        <h3 style="text-align:center; margin-bottom:16px; font-size:1rem; color:var(--text-sub);">📅 306 일정 (3주 이내)</h3>
        <div id="cal-list"></div>
    </div>
</section>

<section id="mileage" class="content-section">
    <div class="sub-nav">
        <button class="active" onclick="window.showSubTab(this,'mileage','m-guide')">적립 및 보상</button>
        <button onclick="window.showSubTab(this,'mileage','m-view')">실시간 랭킹</button>
    </div>
    <div id="m-guide" class="tab-content active">
        <div class="glass-card">
            <div class="guide-section"><h3>📝 적립 방법</h3><div class="guide-box" id="display-reasons"></div></div>
            <div class="guide-section"><h3>🎁 개인 보상</h3><div class="guide-box pink" id="display-personal-rewards"></div></div>
            <div class="guide-section"><h3>🎊 단체 보상</h3><div class="guide-box green" id="display-group-rewards"></div></div>
        </div>
    </div>
    <div id="m-view" class="tab-content">
        <div class="glass-card">
            <h2>🏆 실시간 랭킹</h2>
            <div class="rank-grid" id="mileage-rank-list"></div>
        </div>
    </div>
</section>

<section id="study" class="content-section">
    <div class="sub-nav">
        <button class="active" onclick="window.showSubTab(this,'study','s-upload')">체크하기</button>
        <button onclick="window.showSubTab(this,'study','s-history')">체크 내역</button>
    </div>
    <div id="s-upload" class="tab-content active">
        <div class="glass-card">
            <h2>📚 스터디 체크</h2>
            <div class="cert-limit-info">하루 1회 인증 · 통과 시 +3P 자동 적립 · 오늘 날짜 타임스탬프 필수</div>
            <select id="cert-name"><option value="">이름 선택</option></select>
            <div class="cert-upload-area" onclick="document.getElementById('cert-file-input').click()">
                <div id="cert-placeholder"><span style="font-size:2.5rem;">📷</span><span>사진을 탭하여 선택</span><small>오늘 날짜 타임스탬프가 찍힌 공부 사진</small></div>
                <img id="cert-preview" src="" alt="미리보기">
            </div>
            <input type="file" id="cert-file-input" accept="image/*" style="display:none" onchange="window.previewCertPhoto(this)">
            <div class="cert-btn-row">
                <button class="btn-cam" onclick="window.triggerCamera()">📷 카메라 촬영</button>
                <button class="btn-gallery" onclick="window.triggerGallery()">🖼️ 갤러리 선택</button>
            </div>
            <textarea id="cert-study-content" rows="2" placeholder="무엇을 공부했나요? (예: 수학 미적분, 영어 단어 암기)"></textarea>
            <button class="btn-study-main" id="cert-submit-btn" onclick="window.submitStudyCert()">스터디 체크하기 📚</button>
            <div id="cert-result-box" class="cert-result-box" style="display:none;">
                <span id="cert-result-emoji" class="cert-result-emoji"></span>
                <div id="cert-result-title" class="cert-result-title"></div>
                <div id="cert-result-desc" class="cert-result-desc"></div>
                <div id="cert-result-mileage" class="cert-result-mileage"></div>
            </div>
        </div>
    </div>
    <div id="s-history" class="tab-content">
        <div class="glass-card"><h2>📋 체크 내역</h2><div id="cert-history-list"></div></div>
    </div>
</section>

<section id="praise" class="content-section">
    <div class="sub-nav">
        <button class="active" onclick="window.showSubTab(this,'praise','p-form')">제보하기</button>
        <button onclick="window.showSubTab(this,'praise','p-list')">모아보기</button>
    </div>
    <div id="p-form" class="tab-content active">
        <div class="glass-card">
            <h2>🌟 친구 칭찬 제보</h2>
            <select id="p-from"><option value="">제보자 선택</option></select>
            <select id="p-to"><option value="">칭찬 주인공 선택</option></select>
            <textarea id="p-content" rows="3" placeholder="칭찬 내용을 적어주세요!"></textarea>
            <button class="btn-main" onclick="window.submitPraise()">제보하기 ✉️</button>
        </div>
    </div>
    <div id="p-list" class="tab-content">
        <div class="sort-bar">
            <button class="praise-sort-btn active" onclick="window.sortPraise(this,'date')">📅 날짜별</button>
            <button class="praise-sort-btn" onclick="window.sortPraise(this,'name')">👤 학생별</button>
        </div>
        <div id="praise-view-list"></div>
    </div>
</section>

<section id="today" class="content-section">
    <div class="sub-nav">
        <button class="active" onclick="window.showSubTab(this,'today','t-form')">오늘의 질문</button>
        <button onclick="window.showSubTab(this,'today','t-list')">모아보기</button>
    </div>
    <div id="t-form" class="tab-content active">
        <div class="glass-card">
            <div id="display-date" style="text-align:center; color:var(--text-sub); font-size:0.9rem; margin-bottom:12px; font-weight:700;"></div>
            <div class="q-box"><h4 id="daily-q-text">로딩 중...</h4></div>
            <div id="t-submit-area">
                <select id="t-name"><option value="">이름 선택</option></select>
                <textarea id="t-content" rows="3" placeholder="오늘의 생각을 기록하세요 ✏️"></textarea>
                <button class="btn-main" onclick="window.submitToday()">기록하기</button>
            </div>
        </div>
    </div>
    <div id="t-list" class="tab-content">
        <div class="sort-bar">
            <button class="today-sort-btn active" onclick="window.sortToday(this,'date')">📅 날짜별</button>
            <button class="today-sort-btn" onclick="window.sortToday(this,'name')">👤 이름순</button>
        </div>
        <div id="today-view-list"></div>
    </div>
</section>

</body>
</html>
